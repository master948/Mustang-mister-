<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DO NOT ENTER</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:100%;min-height:100vh;background:black;color:white;font-family:Arial,sans-serif;overflow-x:hidden}
  .screen{width:100%;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
  #screen1 h1{font-size:clamp(28px,8vw,55px);color:red;text-shadow:0 0 20px red;max-width:95vw;line-height:1.1}
  #screen2{background:#111;display:none}
  #screen3{background:#ffeb3b;display:none;color:black}
  .yellow-box{width:100%;max-width:600px;background:white;border:6px solid black;box-shadow:10px 10px 0 black;border-radius:20px;padding:25px}
  button{padding:14px 30px;margin:10px;font-size:18px;font-weight:900;border:3px solid white;background:white;color:black;cursor:pointer}
  img{max-width:90vw;height:auto;display:block;margin:15px auto}
  .loading{display:none;color:red;font-weight:bold;margin-top:15px}
</style>
</head>
<body>

<div id="screen1" class="screen">
  <h1>BEHOLD MY<br>MASTERPIECE</h1>
  <p style="color:#888;margin-top:10px">YOU HAVE BEEN WARNED</p>
  <div style="margin-top:30px">
    <button onclick="go2()">YES</button>
    <button onclick="document.getElementById('nope').innerText='LOL TOO SCARED 😂'">NO</button>
  </div>
  <p id="nope" style="color:red"></p>
  <p id="load1" class="loading">LISTEN...</p>
</div>

<div id="screen2" class="screen">
  <h1>ARE YOU <span style="color:red">SURE?</span></h1>
  <img src="https://upload.wikimedia.org/wikipedia/en/3/3b/SpongeBob_SquarePants_character.svg" width="180" style="background:white;padding:10px;border-radius:15px">
  <p style="color:red">HE IS AN ENTREPRENEUR</p>
  <p id="load2" class="loading">HE IS BEHIND YOU...</p>
  <div>
    <button onclick="go3()">YES I'M SURE</button>
    <button onclick="back1()">NO GO BACK</button>
  </div>
</div>

<div id="screen3" class="screen">
  <div class="yellow-box">
    <h1 style="font-size:clamp(26px,7vw,40px)">Regular<br>Mustangs On Me 😂</h1>
    <p style="background:black;color:yellow;padding:12px;font-weight:900;margin:15px 0">I AM OPTIMUS PRIME AUTOBOTS TRANSFORM AND ROAM OUT!</p>
    <img src="https://media1.tenor.com/m/1Dm6yV9P5V0AAAAC/spongebob.gif" width="250" style="border:4px solid black;border-radius:15px">
    <p style="font-style:italic;margin:15px 0;background:#eee;padding:10px">"How do you like my new hobby huh Mr Plankton...."</p>
    <p style="font-weight:bold">ROARRR! 🐆 JUST KIDDING - MUSTANG GANG!</p>
    <button onclick="back1()" style="background:black;color:yellow;border-color:black;margin-top:15px">SCARE AGAIN</button>
  </div>
</div>

<!-- JAGUAR ROAR - works without upload -->
<audio id="jaguar" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/08/10/audio_1a2b3c4d5e.mp3" type="audio/mpeg">
  <source src="https://actions.google.com/sounds/v1/animals/jaguar_roar.ogg" type="audio/ogg">
  <source src="https://www.soundjay.com/mechanical/jaguar-roar-01.mp3" type="audio/mpeg">
</audio>

<script>
function go2(){
  document.getElementById('load1').style.display='block';
  // First soft roar
  document.getElementById('jaguar').volume = 0.6;
  document.getElementById('jaguar').play().catch(()=>{});
  setTimeout(()=>{document.getElementById('screen1').style.display='none';document.getElementById('screen2').style.display='flex';document.getElementById('load1').style.display='none'},1200)
}
function go3(){
  document.getElementById('load2').style.display='block';
  setTimeout(()=>{
    document.getElementById('screen2').style.display='none';
    document.getElementById('screen3').style.display='flex';
    document.getElementById('load2').style.display='none';
    // LOUD ROAR on final reveal
    let j = document.getElementById('jaguar');
    j.currentTime = 0;
    j.volume = 1.0;
    j.play().catch(()=>{});
  },1500)
}
function back1(){
  document.getElementById('screen2').style.display='none';
  document.getElementById('screen3').style.display='none';
  document.getElementById('screen1').style.display='flex';
  document.getElementById('jaguar').pause();
  window.scrollTo(0,0)
}
</script>
</body>
 </html>
